<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайный Благовещенск</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(150deg, #0b0812 0%, #150f24 40%, #1b1030 100%);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(155, 123, 255, 0.15);
            filter: blur(80px);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(80, 60, 180, 0.12);
            filter: blur(70px);
            bottom: -80px;
            right: -80px;
            border-radius: 50%;
        }

        .app {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(155, 123, 255, 0.3);
            background: rgba(155, 123, 255, 0.08);
            color: #b39bff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }

        .hint {
            color: #6b5f8a;
            font-size: 11px;
            margin-bottom: 20px;
        }

        #header h1 {
            color: #f0ecff;
            font-size: 32px;
            margin-bottom: 10px;
        }

        #header .sub {
            color: #9b8fc0;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 18px 10px;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .btn:nth-child(1) {
            background: rgba(155, 123, 255, 0.12);
            border-color: rgba(155, 123, 255, 0.3);
        }

        .btn:nth-child(1):hover {
            background: rgba(155, 123, 255, 0.25);
        }

        .btn:nth-child(2) {
            background: rgba(255, 110, 180, 0.12);
            border-color: rgba(255, 110, 180, 0.3);
        }

        .btn:nth-child(2):hover {
            background: rgba(255, 110, 180, 0.25);
        }

        .btn:nth-child(3) {
            background: rgba(110, 180, 255, 0.12);
            border-color: rgba(110, 180, 255, 0.3);
        }

        .btn:nth-child(3):hover {
            background: rgba(110, 180, 255, 0.25);
        }

        .btn:nth-child(4) {
            background: rgba(255, 220, 110, 0.12);
            border-color: rgba(255, 220, 110, 0.3);
        }

        .btn:nth-child(4):hover {
            background: rgba(255, 220, 110, 0.25);
        }

        .btn:nth-child(5) {
            grid-column: span 2;
            background: rgba(255, 90, 90, 0.12);
            border-color: rgba(255, 90, 90, 0.3);
        }

        .btn:nth-child(5):hover {
            background: rgba(255, 90, 90, 0.25);
        }

        .result {
            display: none;
            background: rgba(155, 123, 255, 0.08);
            border: 1px solid rgba(155, 123, 255, 0.25);
            border-radius: 16px;
            padding: 24px 18px;
            color: #d8d0f0;
            font-size: 15px;
            line-height: 1.6;
            min-height: 120px;
            animation: pop 0.4s ease;
        }

        .actions {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 13px;
            color: #d8d0f0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: rgba(155, 123, 255, 0.12);
            border-color: rgba(155, 123, 255, 0.35);
            color: #ffffff;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="badge" id="badge" onclick="unlockGossip()">🕵️ ТАЙНЫЙ БЛАГОВЕЩЕНСК</div>
        <p class="hint">нажми на бейдж два раза — откроешь то, что знают не все</p>

        <div id="header">
            <h1>Город знает тебя</h1>
            <p class="sub">Выбери, что тебе сейчас нужно</p>
        </div>

        <div class="menu" id="menu">
            <button class="btn" onclick="show('kuda')">🚶 Куда сходить</button>
            <button class="btn" onclick="show('eat')">🍽 Поесть</button>
            <button class="btn" onclick="show('sit')">😌 Посидеть</button>
            <button class="btn" onclick="show('nature')">🌿 Природа</button>
            <button class="btn" id="gossipBtn" style="display:none;" onclick="show('gossip')">🤫 Слухи</button>
        </div>

        <div class="result" id="result"></div>

        <div class="actions" id="actions">
            <button class="btn-small" onclick="more()">🔄 Ещё</button>
            <button class="btn-small" onclick="back()">← Назад</button>
        </div>
    </div>

    <script>
        let badgeClicks = 0;

        function unlockGossip() {
            badgeClicks++;
            if (badgeClicks >= 2) {
                document.getElementById('gossipBtn').style.display = 'block';
            }
        }

        const ideas = {
            kuda: [
                "парк Киселёва — дойди, там ебать круто",
                "пруд в Инзе — вода, тишина, кайф",
                "стадион в Низах — место, где у всех что-то было в первый раз",
                "смотровая вышка — вид на парк и пруд, залипнешь",
                "аллея у белого голубя — свежо и красиво",
                "тропа здоровья — турники и воздух",
                "Инь-Янь — маленький прудик и скамейки. Прийти и зависнуть",
                "Заряд — качалка, бассейн и скалолазание. Попробуй залезть на стенку",
                "Импульс — качалка и бассейн. Сходи поплавать",
                "Кванториум — 800 квадратов технологий. Лазеры, 3D, роботы. Если тебе до 18 — загляни",
                "ГАИ — район, который зря называют опасным. Там лучшие люди и куча магазинчиков",
                "Котловка — тихий райончик, где особо ничего не происходит. Иногда это лучшее",
                "Щорсы — маленький микрорайон. Старые хрущёвки и новые дома",
                "остров в Низах — качели и большие мероприятия",
                "скейт-парк в Низах — приходи кататься",
                "кинотеатр «Салют» — старое, но живое",
                "«Факел» на ГАИ — бокс, карате, рисование. Может, твоё"
            ],
            eat: [
                "«Милк» на Седова, 113 — бургеры и пицца",
                "шашлычная на Седова, 100А — круглосуточно, для голодных ночью",
                "«Тройка» в Низах — круглосуточно",
                "«Фор-Фор» — пицца и роллы",
                "«Венеция» — вкусно и недорого",
                "Food House в Низах",
                "«Икмек» на ГАИ — лёгкая выпечка",
                "«Магнит» на ГАИ — выпечка, бургеры, хот-доги",
                "«Чиполлино» на остановке Алексей — вкусно",
                "кафешка «Парковка» рядом с Квадратом",
                "«Гурман» в Низах — круглосуточно",
                "«Монетка» — магазин, если надо быстро"
            ],
            sit: [
                "три стула в парке Машиностроителей — сядь, выдохни",
                "скамейки у педколледжа",
                "качели перед озером",
                "набережная — вода и тишина",
                "тихие дворы за Седова",
                "Инь-Янь — маленький прудик, скамейки. Можно зависнуть",
                "Квадрат — высотки по кругу, внутри площадка. Посидеть и посмотреть",
                "площадка за педколледжем — тихо и спокойно",
                "остановка Алексей — просто сядь и смотри, кто приходит"
            ],
            nature: [
                "сосновая роща — сосны с 1892 года, ебать как круто",
                "пойма — вода и закат",
                "родник — набери воды",
                "озеро в парке Машиностроителей",
                "река Белая — просто смотри, как течёт",
                "бассейн в «Заре» — поплавать",
                "бассейн в «Импульсе» — вода и отдых",
                "затон — вода, тишина, природа"
            ],
            gossip: [
                "на Инзе все знают...\nчто?\nнапиши автору, если знаешь",
                "в Низах выпускники делали после выпускного...\nтолько тссс",
                "на ГАИ за проблемами лучше не идти",
                "в благе есть чат «В благе любят» — если ты там, ты свой",
                "ГАИ — лучшее кино в окне: суета, драма, полиция вяжет ровных пацанчиков и частые спарринги людей. Чисто спортивный интерес",
                "многие считают ГАИ опасным — это стереотип. ГАИ — лучший район",
                "утром в 9 автобус на БМПК — это испытание. Студентов развелось как муравьёв",
                "после 4-й пары студенты ломают себя, чтобы влезть в автобус и уехать домой"
            ]
        };

        const queues = {};
        let currentCategory = null;

        function getQueue(category) {
            if (!queues[category] || queues[category].length === 0) {
                queues[category] = [...ideas[category]].sort(() => Math.random() - 0.5);
            }
            return queues[category];
        }

        function show(category) {
            currentCategory = category;
            const queue = getQueue(category);
            const idea = queue.shift();

            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            const result = document.getElementById('result');
            result.style.display = 'block';
            result.textContent = idea;

            document.getElementById('actions').style.display = 'flex';
        }

        function more() {
            if (!currentCategory) return;
            const queue = getQueue(currentCategory);
            const idea = queue.shift();
            document.getElementById('result').textContent = idea;
        }

        function back() {
            document.getElementById('header').style.display = 'block';
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('result').style.display = 'none';
            document.getElementById('actions').style.display = 'none';
        }
    </script>
</body>
</html>
