<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайный Благовещенск</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0b0812 0%, #150f24 30%, #1b1030 60%, #0f0a1a 100%);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(155, 123, 255, 0.25) 0%, transparent 70%);
            filter: blur(60px);
            top: -150px;
            left: -150px;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 110, 180, 0.18) 0%, transparent 70%);
            filter: blur(70px);
            bottom: -120px;
            right: -120px;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 20px); }
        }

        .app {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px 15px;
            width: 100%;
            max-width: 360px;
        }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 100px;
            border: 1px solid rgba(155, 123, 255, 0.3);
            background: rgba(155, 123, 255, 0.08);
            color: #b39bff;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        #header h1 {
            color: #f0ecff;
            font-size: 26px;
            margin-bottom: 6px;
        }

        #header .sub {
            color: #9b8fc0;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 13px 6px;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .btn:nth-child(1) {
            background: rgba(155, 123, 255, 0.12);
            border-color: rgba(155, 123, 255, 0.3);
        }

        .btn:nth-child(2) {
            background: rgba(255, 110, 180, 0.12);
            border-color: rgba(255, 110, 180, 0.3);
        }

        .btn:nth-child(3) {
            background: rgba(110, 180, 255, 0.12);
            border-color: rgba(110, 180, 255, 0.3);
        }

        .btn:nth-child(4) {
            background: rgba(255, 220, 110, 0.12);
            border-color: rgba(255, 220, 110, 0.3);
        }

        .btn:nth-child(5) {
            grid-column: span 2;
            background: rgba(255, 90, 90, 0.12);
            border-color: rgba(255, 90, 90, 0.3);
        }

        .result {
            display: none;
            background: rgba(155, 123, 255, 0.08);
            border: 1px solid rgba(155, 123, 255, 0.25);
            border-radius: 14px;
            padding: 20px 16px;
            color: #d8d0f0;
            font-size: 14px;
            line-height: 1.6;
            min-height: 110px;
            animation: pop 0.4s ease;
        }

        .actions {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 11px;
            color: #d8d0f0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-gear {
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-size: 16px;
            opacity: 0.25;
            cursor: pointer;
            transition: opacity 0.3s ease;
            background: none;
            border: none;
            color: #ffffff;
            z-index: 10;
        }

        .admin-gear:hover {
            opacity: 0.6;
        }

        .admin-panel {
            display: none;
            position: fixed;
            bottom: 45px;
            left: 12px;
            background: rgba(15, 10, 25, 0.95);
            border: 1px solid rgba(155, 123, 255, 0.3);
            border-radius: 14px;
            padding: 16px;
            width: 240px;
            z-index: 20;
        }

        .admin-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
        }

        textarea.admin-input {
            text-align: left;
            resize: vertical;
        }

        .admin-btn {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(155, 123, 255, 0.2);
            color: #d8d0f0;
            font-size: 13px;
            cursor: pointer;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="badge">🕵️ ТАЙНЫЙ БЛАГОВЕЩЕНСК</div>

        <div id="header">
            <h1>Город знает тебя</h1>
            <p class="sub">Выбери, что тебе сейчас нужно</p>
        </div>

        <div class="menu" id="menu">
            <button class="btn" onclick="show('kuda')">🚶 Куда сходить</button>
            <button class="btn" onclick="show('eat')">🍽 Поесть</button>
            <button class="btn" onclick="show('sit')">😌 Посидеть</button>
            <button class="btn" onclick="show('nature')">🌿 Природа</button>
            <button class="btn" onclick="show('gossip')">🤫 Слухи</button>
        </div>

        <div class="result" id="result"></div>

        <div class="actions" id="actions">
            <button class="btn-small" onclick="more()">🔄 Ещё</button>
            <button class="btn-small" onclick="back()">← Назад</button>
        </div>
    </div>

    <button class="admin-gear" onclick="openAdmin()">⚙️</button>

    <div class="admin-panel" id="adminPanel">
        <div id="loginBlock">
            <input class="admin-input" id="pinInput" type="password" placeholder="Пин-код" maxlength="4">
            <button class="admin-btn" onclick="checkPin()">Войти</button>
        </div>

        <div id="adminContent" style="display:none;">
            <button class="admin-btn" onclick="showAddForm()">➕ Добавить идею</button>
            <button class="admin-btn" onclick="showAllIdeas()">📋 Все идеи</button>
            <button class="admin-btn" onclick="showStats()">📊 Статистика</button>
            <button class="admin-btn" onclick="closeAdmin()">← Назад</button>
        </div>

        <div id="addForm" style="display:none;">
            <select id="categorySelect" class="admin-input">
                <option value="kuda">🚶 Куда сходить</option>
                <option value="eat">🍽 Поесть</option>
                <option value="sit">😌 Посидеть</option>
                <option value="nature">🌿 Природа</option>
                <option value="gossip">🤫 Слухи</option>
            </select>
            <textarea id="ideaText" class="admin-input" rows="3" placeholder="Текст идеи"></textarea>
            <button class="admin-btn" onclick="addIdea()">Сохранить</button>
            <button class="admin-btn" onclick="backToAdmin()">← Назад</button>
        </div>

        <div id="listBlock" style="display:none;">
            <div id="ideasList" style="max-height: 200px; overflow-y: auto; margin-top: 8px;"></div>
            <button class="admin-btn" onclick="backToAdmin()">← Назад</button>
        </div>

        <div id="statsBlock" style="display:none;">
            <div id="statsText" style="color: #d8d0f0; font-size: 13px; margin: 8px 0;"></div>
            <button class="admin-btn" onclick="backToAdmin()">← Назад</button>
        </div>
    </div>

    <script>
        const PIN = "8357";
        let clicks = {};

        const ideas = {
            kuda: [
                "парк Киселёва — дойди, там ебать круто",
                "пруд в Инзе — вода, тишина, кайф",
                "стадион в Низах — место, где у всех что-то было в первый раз",
                "смотровая вышка — вид на парк и пруд, залипнешь",
                "аллея у белого голубя — свежо и красиво",
                "тропа здоровья — турники и воздух",
                "Инь-Янь — маленький прудик и скамейки. Прийти и зависнуть",
                "Заряд — качалка, бассейн и скалолазание. Попробуй залезть на стенку",
                "Импульс — качалка и бассейн. Сходи поплавать",
                "Кванториум — 800 квадратов технологий. Лазеры, 3D, роботы. Если тебе до 18 — загляни",
                "ГАИ — район, который зря называют опасным. Там лучшие люди и куча магазинчиков",
                "Котловка — тихий райончик, где особо ничего не происходит. Иногда это лучшее",
                "Щорсы — маленький микрорайон. Старые хрущёвки и новые дома",
                "остров в Низах — качели и большие мероприятия",
                "скейт-парк в Низах — приходи кататься",
                "кинотеатр «Салют» — старое, но живое",
                "«Факел» на ГАИ — бокс, карате, рисование. Может, твоё"
            ],
            eat: [
                "«Милк» на Седова, 113 — бургеры и пицца",
                "шашлычная на Седова, 100А — круглосуточно, для голодных ночью",
                "«Тройка» в Низах — круглосуточно",
                "«Фор-Фор» — пицца и роллы",
                "«Венеция» — вкусно и недорого",
                "Food House в Низах",
                "«Икмек» на ГАИ — лёгкая выпечка",
                "«Магнит» на ГАИ — выпечка, бургеры, хот-доги",
                "«Чиполлино» на остановке Алексей — вкусно",
                "кафешка «Парковка» рядом с Квадратом",
                "«Гурман» в Низах — круглосуточно",
                "«Монетка» — магазин, если надо быстро"
            ],
            sit: [
                "три стула в парке Машиностроителей — сядь, выдохни",
                "скамейки у педколледжа",
                "качели перед озером",
                "набережная — вода и тишина",
                "тихие дворы за Седова",
                "Инь-Янь — маленький прудик, скамейки. Можно зависнуть",
                "Квадрат — высотки по кругу, внутри площадка. Посидеть и посмотреть",
                "площадка за педколледжем — тихо и спокойно",
                "остановка Алексей — просто сядь и смотри, кто приходит"
            ],
            nature: [
                "сосновая роща — сосны с 1892 года, ебать как круто",
                "пойма — вода и закат",
                "родник — набери воды",
                "озеро в парке Машиностроителей",
                "река Белая — просто смотри, как течёт",
                "бассейн в «Заре» — поплавать",
                "бассейн в «Импульсе» — вода и отдых",
                "затон — вода, тишина, природа"
            ],
            gossip: [
                "на Инзе все знают...\nчто?\nнапиши автору, если знаешь",
                "в Низах выпускники делали после выпускного...\nтолько тссс",
                "на ГАИ за проблемами лучше не идти",
                "в благе есть чат «В благе любят» — если ты там, ты свой",
                "ГАИ — лучшее кино в окне: суета, драма, полиция вяжет ровных пацанчиков и частые спарринги людей. Чисто спортивный интерес",
                "многие считают ГАИ опасным — это стереотип. ГАИ — лучший район",
                "утром в 9 автобус на БМПК — это испытание. Студентов развелось как муравьёв",
                "после 4-й пары студенты ломают себя, чтобы влезть в автобус и уехать домой"
            ]
        };

        const queues = {};
        let currentCategory = null;

        function openAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function checkPin() {
            const input = document.getElementById('pinInput').value;
            if (input === PIN) {
                document.getElementById('loginBlock').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('pinInput').value = '';
            } else {
                alert('❌ Неверный код');
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginBlock').style.display = 'block';
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('addForm').style.display = 'none';
            document.getElementById('listBlock').style.display = 'none';
            document.getElementById('statsBlock').style.display = 'none';
        }

        function showAddForm() {
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('addForm').style.display = 'block';
        }

        function backToAdmin() {
            document.getElementById('adminContent').style.display = 'block';
            document.getElementById('addForm').style.display = 'none';
            document.getElementById('listBlock').style.display = 'none';
            document.getElementById('statsBlock').style.display = 'none';
        }

        function addIdea() {
            const category = document.getElementById('categorySelect').value;
            const text = document.getElementById('ideaText').value.trim();
            if (!text) {
                alert('❌ Введи текст идеи');
                return;
            }
            ideas[category].push(text);
            alert('✅ Идея добавлена!');
            document.getElementById('ideaText').value = '';
            backToAdmin();
        }

        function showAllIdeas() {
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('listBlock').style.display = 'block';

            let html = '';
            for (const cat in ideas) {
                html += `<p style="color:#b39bff; margin-top:8px;">${cat}</p>`;
                ideas[cat].forEach((idea, i) => {
                    html += `<p style="color:#d8d0f0; font-size:12px;">${i + 1}. ${idea}</p>`;
                });
            }
            document.getElementById('ideasList').innerHTML = html;
        }

        function showStats() {
            document.getElementById('adminContent').style.display = 'none';
            document.getElementById('statsBlock').style.display = 'block';

            let total = 0;
            for (const cat in ideas) {
                total += ideas[cat].length;
            }

            const clicksTotal = Object.values(clicks).reduce((a, b) => a + b, 0);

            document.getElementById('statsText').innerHTML = `
                Идей всего: ${total}<br>
                Кнопок нажато: ${clicksTotal}
            `;
        }

        function getQueue(category) {
            if (!queues[category] || queues[category].length === 0) {
                queues[category] = [...ideas[category]].sort(() => Math.random() - 0.5);
            }
            return queues[category];
        }

        function show(category) {
            clicks[category] = (clicks[category] || 0) + 1;
            currentCategory = category;
            const queue = getQueue(category);
            const idea = queue.shift();

            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            const result = document.getElementById('result');
            result.style.display = 'block';
            result.textContent = idea;

            document.getElementById('actions').style.display = 'flex';
        }

        function more() {
            if (!currentCategory) return;
            const queue = getQueue(currentCategory);
            const idea = queue.shift();
            document.getElementById('result').textContent = idea;
        }

        function back() {
            document.getElementById('header').style.display = 'block';
            document.getElementById('menu').style.display = 'grid';
            document.getElementById('result').style.display = 'none';
            document.getElementById('actions').style.display = 'none';
        }
    </script>
</body>
</html>
