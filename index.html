<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайный Благовещенск</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(150deg, #0b0812 0%, #150f24 40%, #1b1030 100%);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(155, 123, 255, 0.15);
            filter: blur(80px);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(80, 60, 180, 0.12);
            filter: blur(70px);
            bottom: -80px;
            right: -80px;
            border-radius: 50%;
        }

        .app {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(155, 123, 255, 0.3);
            background: rgba(155, 123, 255, 0.08);
            color: #b39bff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        h1 {
            color: #f0ecff;
            font-size: 32px;
            margin-bottom: 10px;
            transition: all 0.5s ease;
        }

        .sub {
            color: #9b8fc0;
            font-size: 15px;
            margin-bottom: 25px;
            transition: all 0.5s ease;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.5s ease;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 16px;
            color: #d8d0f0;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(155, 123, 255, 0.12);
            border-color: rgba(155, 123, 255, 0.35);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .result {
            display: none;
            background: rgba(155, 123, 255, 0.08);
            border: 1px solid rgba(155, 123, 255, 0.25);
            border-radius: 16px;
            padding: 24px 18px;
            color: #d8d0f0;
            font-size: 15px;
            line-height: 1.6;
            min-height: 120px;
            animation: pop 0.4s ease;
        }

        .actions {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            animation: fade 0.5s ease;
        }

        .btn-small {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 13px;
            color: #d8d0f0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: rgba(155, 123, 255, 0.12);
            border-color: rgba(155, 123, 255, 0.35);
            color: #ffffff;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="badge">🕵️ ТАЙНЫЙ БЛАГОВЕЩЕНСК</div>

        <div id="header">
            <h1>Город знает тебя</h1>
            <p class="sub">Выбери, что тебе сейчас нужно</p>
        </div>

        <div class="menu" id="menu">
            <button class="btn" onclick="show('kuda')">🚶 Куда сходить</button>
            <button class="btn" onclick="show('eat')">🍽 Поесть</button>
            <button class="btn" onclick="show('sit')">😌 Посидеть</button>
            <button class="btn" onclick="show('nature')">🌿 Природа</button>
            <button class="btn" onclick="show('gossip')">🤫 Слухи</button>
        </div>

        <div class="result" id="result"></div>

        <div class="actions" id="actions">
            <button class="btn-small" onclick="more()">🔄 Ещё</button>
            <button class="btn-small" onclick="back()">← Назад</button>
        </div>
    </div>

    <script>
        const ideas = {
            kuda: [
                "парк Киселёва — дойди и просто побудь",
                "городской пруд на Потехе — вода и тишина",
                "стадион в Низах — место силы",
                "смотровая вышка — вид на парк и пруд",
                "аллея у белого голубя — свежо и красиво",
                "тропа здоровья — турники и воздух"
            ],
            eat: [
                "«Милк» на Седова, 113",
                "шашлычная на Седова, 100А — круглосуточно",
                "«Тройка» в Низах — круглосуточно",
                "«Фор-Фор» — пицца и роллы",
                "«Венеция» — просто и вкусно",
                "Food House в Низах"
            ],
            sit: [
                "три стула в парке — просто сядь",
                "скамейки у педколледжа",
                "сквер на Седова, 107",
                "качели перед озером",
                "набережная Потехи",
                "тихие дворы за Седова"
            ],
            nature: [
                "сосновая роща — сосны с 1892 года",
                "пойма Потехи — вода и закат",
                "родник — набери воды",
                "озеро в парке Машиностроителей",
                "река Белая — просто смотри"
            ],
            gossip: [
                "на Инзе все знают...\nчто?\nнапиши автору, если знаешь",
                "в Низах выпускники делали после выпускного...\nтолько тссс",
                "на ГАИ за проблемами лучше не идти",
                "в благе есть чат «В благе любят» — если ты там, ты свой"
            ]
        };

        const queues = {};
        let currentCategory = null;

        function getQueue(category) {
            if (!queues[category] || queues[category].length === 0) {
                queues[category] = [...ideas[category]].sort(() => Math.random() - 0.5);
            }
            return queues[category];
        }

        function show(category) {
            currentCategory = category;
            const queue = getQueue(category);
            const idea = queue.shift();

            document.getElementById('header').style.display = 'none';
            document.getElementById('menu').style.display = 'none';

            const result = document.getElementById('result');
            result.style.display = 'block';
            result.textContent = idea;

            document.getElementById('actions').style.display = 'flex';
        }

        function more() {
            if (!currentCategory) return;
            const queue = getQueue(currentCategory);
            const idea = queue.shift();
            document.getElementById('result').textContent = idea;
        }

        function back() {
            document.getElementById('header').style.display = 'block';
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('result').style.display = 'none';
            document.getElementById('actions').style.display = 'none';
        }
    </script>
</body>
</html>
